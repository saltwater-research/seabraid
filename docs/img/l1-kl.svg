<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-labelledby="t d">
<title id="t">Decode-path KL and top-1 agreement against the main card alone</title>
<desc id="d">Pyramid runs C1a and C1b score KL 0.00132 and 0.00130 with top-1 agreement 0.9817 and 0.9858; the noise floor is 0.00135 and 0.985. Gates are KL at most 0.03 and top-1 at least 0.95.</desc>
<style>
text{font-family:'Times New Roman',Times,Georgia,serif;fill:#000;font-size:13px}
.s{font-size:12px}.e{text-anchor:end}.c{text-anchor:middle}
.rule{stroke:#bbb;stroke-width:.75;fill:none}.box{fill:#fff;stroke:#000;stroke-width:1}
.up{fill:#1f3a6e;stroke:#1f3a6e}.dn{fill:#888;stroke:#888}.ref{fill:#fff;stroke:#000;stroke-width:1}
.gate{stroke:#000;stroke-width:1;stroke-dasharray:5 4;fill:none}.ln{stroke-width:1.5;fill:none}.dash{stroke-dasharray:5 3}
</style>
<rect width="880" height="232" fill="#fff"/>
<text x="250" y="24">KL divergence (lower is better)</text>
