<line x1="770" y1="42" x2="770" y2="176" class="rule"/>
<text x="770" y="194" class="s c">0.98</text>
<line x1="850" y1="42" x2="850" y2="176" class="rule"/>
<text x="850" y="194" class="s c">1</text>
<line x1="650" y1="42" x2="650" y2="178" class="gate"/>
<text x="650" y="214" class="s c">gate ≥ 0.95</text>
<circle cx="776.8" cy="64" r="6" class="up"/>
<text x="776.8" y="52" class="c">0.9817</text>
<circle cx="793.2" cy="108" r="6" class="dn"/>
<text x="793.2" y="96" class="c">0.9858</text>
