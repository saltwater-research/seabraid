<text x="250" y="194" class="s c">0</text>
<line x1="312.857" y1="42" x2="312.857" y2="176" class="rule"/>
<text x="312.857" y="194" class="s c">0.01</text>
<line x1="375.714" y1="42" x2="375.714" y2="176" class="rule"/>
<text x="375.714" y="194" class="s c">0.02</text>
<line x1="438.571" y1="42" x2="438.571" y2="176" class="rule"/>
<text x="438.571" y="194" class="s c">0.03</text>
<line x1="438.571" y1="42" x2="438.571" y2="178" class="gate"/>
<text x="438.571" y="214" class="s c">gate ≤ 0.03</text>
<circle cx="258.297" cy="64" r="6" class="up"/>
<text x="258.297" y="52" class="c">0.00132</text>
<circle cx="258.171" cy="108" r="6" class="dn"/>
<text x="258.171" y="96" class="c">0.00130</text>
<circle cx="258.486" cy="152" r="6" class="ref"/>
<text x="258.486" y="140" class="c">0.00135</text>
<text x="610" y="24">top-1 agreement (higher is better)</text>
<line x1="610" y1="42" x2="610" y2="176" class="rule"/>
<text x="610" y="194" class="s c">0.94</text>
<line x1="690" y1="42" x2="690" y2="176" class="rule"/>
